name: CI

# 蓝鲸双系统端到端测试平台：push 即跑全量用例 + 覆盖率徽章
# 无 ESB 凭证时环境层用例诚实跳过（不造假绿），unit 层真实执行

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

# 覆盖率徽章要回写仓库，需给 GITHUB_TOKEN 写权限
permissions:
  contents: write

jobs:
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests with coverage
        run: |
          pytest --cov=app --cov-report=term-missing --cov-report=xml

      - name: Generate coverage badge
        uses: tj-actions/coverage-badge-py@v2
        with:
          output: badge.svg

      - name: Commit coverage badge back to repo
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "docs: update coverage badge [skip ci]"
          file_pattern: badge.svg

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
