[pytest]
testpaths = tests
# 分层结构（金字塔）：unit 打底 → 单系统链路分开测 → 跨系统连块测
#   分开测 = 故障隔离：JOB 六链路 + CMDB 链路各自独立跑
#   连块测 = 业务闭环：integration 一个用例里同时调两系统接口
markers =
    unit: 纯函数/不依赖环境的测试，凭证没到也能跑
    script: JOB链路1 脚本管理（建脚本→版本→上线→禁用→删）
    fast_exec: JOB链路2 快速执行（执行→状态→日志）
    plan: JOB链路3 作业编排（模板→方案→实例）
    cron: JOB链路4 定时任务（crontab 增删改查）
    account: JOB链路5 账号管理与高危命令检测
    file: JOB链路6 文件分发与SQL执行（推配置/传文件/SQL）
    cmdb: CMDB独立链路（分开测：业务→主机→拓扑→模型→分组）
    integration: 跨系统联动（连块测：契约一致性/业务联动/隔离反向）
    boundary: 参数边界测试（等价类+边界值+非法值）
    platform: Web平台层测试（冒烟计划排除，避免“跑测试”自引用）
